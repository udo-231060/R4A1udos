name: Java Campus Chat
on:
  push:
    paths: ['src/campus-chat-java/**', '.github/workflows/java-chat.yml']
  pull_request:
    paths: ['src/campus-chat-java/**', '.github/workflows/java-chat.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/campus-chat-java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: mvn --batch-mode verify
      - run: node --check src/main/resources/static/app.js
      - run: node tests/http-smoke.mjs
